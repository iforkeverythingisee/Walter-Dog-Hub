name: Check game data

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gamefile-syntax:
    name: Syntax-check Reference/Gamefile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: node --check Reference/Gamefile
        run: node --check Reference/Gamefile
